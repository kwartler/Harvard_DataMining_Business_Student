name: Downdetector Big-Brand Collect
on:
  schedule:
    # Every 15 minutes, matching Downdetector's own 15-minute report buckets.
    # GitHub scheduled crons can run late or skip; the collector backfills up
    # to 24h of missed buckets from each page, so late runs self-heal.
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: downdetector-additive-writers
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      COLLECTION_LABEL: downdetector big-brand poll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll Downdetector (never hard-fails on fetch problems)
        run: python downdetector_data/fetch_downdetector.py
      - name: Commit and push new rows without force
        run: |
          set -euo pipefail
          snapshot=${RUNNER_TEMP:-/tmp}/downdetector-preserved
          mkdir -p "$snapshot/downdetector_data"
          cp -a downdetector_data/downdetector_outages.csv "$snapshot/downdetector_data/" || true
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add -- downdetector_data/downdetector_outages.csv
          if git diff --cached --quiet; then
            echo 'No new rows this poll; nothing to commit.'
            exit 0
          fi
          git commit -m "data: ${COLLECTION_LABEL} $(date -u +'%F %H:%M')Z"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "Rebase conflict. Collected CSV preserved in $snapshot; not pushed." >&2
              exit 1
            fi
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo 'Collected rows pushed successfully.'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying fetch/rebase without force." >&2
            sleep 5
          done
          echo "Push failed after 3 attempts. Collected CSV preserved in $snapshot." >&2
          exit 1
      - name: Upload preserved outputs if any later step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: downdetector-preserved-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/downdetector-preserved/
            downdetector_data/downdetector_outages.csv
          if-no-files-found: warn
          retention-days: 30
