name: Tokenomics Hourly Day-View Snapshot
on:
  schedule:
    - cron: '14 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokenomics-additive-writers
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      COLLECTION_LABEL: hourly day-view snapshot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Snapshot day view (up to 2 attempts)
        run: |
          for attempt in 1 2; do
            if python tokenomics_data/fetch_hourly_top50.py; then exit 0; fi
            if [ "$attempt" -lt 2 ]; then sleep 60; fi
          done
          exit 1
      - name: Move rows older than 14 days into monthly archives
        run: python tokenomics_data/rotate_hourly_top50.py
      - name: Preserve outputs and push without force
        run: bash tokenomics_data/push_collected.sh tokenomics_data/hourly_top50.csv tokenomics_data/hourly_archive tokenomics_data/hourly_top50_raw tokenomics_data/hourly_state.json
      - name: Upload preserved outputs if any later step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-top50-preserved-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenomics-preserved/
            tokenomics_data/hourly_top50.csv
            tokenomics_data/hourly_archive/
            tokenomics_data/hourly_top50_raw/
            tokenomics_data/hourly_state.json
          if-no-files-found: warn
          retention-days: 30
