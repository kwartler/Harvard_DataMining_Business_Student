name: Tokenomics Broad Collection Retry
on:
  workflow_run:
    workflows: [Tokenomics Daily Collection]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokenomics-additive-writers
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      COLLECTION_LABEL: tokenomics broad retry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Retry unchanged broad collector (up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            if python tokenomics_data/fetch_tokens.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 300; fi
          done
          exit 1
      - name: Preserve outputs and push without force
        run: bash tokenomics_data/push_collected.sh tokenomics_data/model_tokens.csv tokenomics_data/model_registry.csv
      - name: Upload preserved outputs if any later step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broad-retry-preserved-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenomics-preserved/
            tokenomics_data/model_tokens.csv
            tokenomics_data/model_registry.csv
          if-no-files-found: warn
          retention-days: 30
